id: "09"
slug: plc_control_cabling
badge: "SHEET 09 · PLC & CONTROL"
title: "PLCs, instrumentation and control cabling"
subtitle: "Supply, functional earth, isolation, cable lengths, shields and surge immunity of the Siemens LOGO! 8, and the earthing and surge protection of instrumentation, control and bus lines"
applies_to: "Siemens LOGO! 8 base modules, expansion modules, TDE and CSM, their power supplies and I/O cabling; instrumentation and control cables, cable screens and armour; measuring, control, bus and RS-485 lines"
accent: purple
version: "1.0"
contents: true
sections:
  - title: "1  LOGO! 8 supply and its protection"
    lead: "Siemens builds LOGO! 8 in mains (230 V) and low-voltage (24 V and 12 V) versions; the supply limits and the protection of the supply lines differ between them.{{F197}}"
    blocks:
      - numbers:
          - value: "+20 %"
            label: "varistor operating voltage above the rated voltage, LOGO! AC supplies{{F182}}"
          - value: "100 m"
            label: "max. unshielded digital input line, LOGO! 24CE and 230RCE{{F223, F234}}"
          - value: "10 m"
            label: "max. shielded, twisted analog input line, LOGO! 24CE and AM2{{F223, F235}}"
          - value: "B16"
            label: "max. protection of an output relay, LOGO! 230 V versions{{F221}}"
      - h2: "Supply ranges"
      - facts: [F197, F219, F222, F224, F225, F227]
      - h2: "Protecting the supply lines"
      - facts: [F182, F183, F198]
      - h2: "Outputs"
      - facts: [F189, F221, F208]

  - title: "2  Functional earth"
    lead: "Siemens describes LOGO! as double-insulated switchgear whose FE (functional earth) terminal must still be connected to earth ground.{{F181}}"
    blocks:
      - diagram:
          name: plc_cabling
          caption: "Concept sketch, not a product wiring diagram. (1) The LOGO! FE terminal is connected to earth ground{{F181}} (2) shield termination: Siemens clamps the shield of a LOGO! analog encoder wire on one side only, to the FE terminal of the expansion module{{F205}}, whereas DEHN requires shields to be earthed at least at both ends; see the chapter on where the sources disagree{{D031}} (3) DEHN: where a building has an external lightning protection system, a measuring/control cable running outside it needs a type 1 lightning current arrester{{D057}}, and a signal-line SPD should be as close as possible to the terminal device{{D060}} (4) Siemens keeps AC wiring, switched high-voltage DC circuits and low-voltage signal wiring separate{{F186}}; DEHN separates or shields unprotected cable upstream of an SPD from the protected cable downstream.{{D062}}"
      - facts: [F180, F181, F203, F226, F210, F230]
      - callout:
          kind: do
          title: "Connect FE even though the device is double-insulated"
          text: "The LOGO! FE terminal must be connected to earth ground{{F181}}; on the AM2 analog module the same terminal takes the shield of the analog measuring cable.{{F203}}"
      - h2: "Reference potential and ungrounded supplies"
      - facts: [F202, F206]

  - title: "3  Isolation and voltage classes"
    lead: "Which LOGO! interfaces are galvanically isolated decides which devices may share a voltage class and a reference potential.{{F195, F194}}"
    blocks:
      - facts: [F195, F194, F233, F235, F207, F220]
      - callout:
          kind: dont
          title: "Do not mix phases on an input group"
          text: "Siemens states that current safety regulations do not permit connecting different phases to a LOGO! AC input group (I1 to I4 or I5 to I8) or to the inputs of a digital module.{{F199}}"

