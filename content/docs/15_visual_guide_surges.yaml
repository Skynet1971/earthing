id: "15"
slug: visual_guide_lightning_surges_spds
badge: "VISUAL GUIDE 2 · SURGES"
icon: play
title: "Visual guide 2: lightning, surges and surge protectors"
subtitle: "Animated pictures of lightning protection zones and of why surge-protector wires must be short"
applies_to: "Anyone choosing or checking surge protective devices in a house distribution board"
accent: amber
version: "1.0"
sections:
  - title: "1  Zones: each boundary takes energy out"
    blocks:
      - explainer:
          name: ex_lpz
          caption: "LPZ 0 is exposed to direct strokes and may carry the full lightning current{{A063}}; LPZ 1 is subject to partial lightning currents{{A064}}; LPZ 2 sees only remnants of the impulse currents.{{A065}} The SPD at the LPZ 0/1 boundary provides lightning current protection, the SPD at the LPZ 1/2 boundary overvoltage protection{{A067}}, and the zones combine bonding, shielding and coordinated SPDs.{{A066}}"
      - numbers:
          - value: "25 kA"
            label: "typical Type 1 test current per mode (10/350) at the main board, LPZ 0/1{{I008}}"
          - value: "40 kA"
            label: "typical Type 2 test current (8/20) at sub-distribution, LPZ 1/2{{I008}}"
      - facts: [I008, D041, D042]
  - title: "2  Surge-protector wires must be short"
    blocks:
      - explainer:
          name: ex_spd_leads
          caption: "BEAMA takes lead inductance as 1 µH/m, so an impulse rising at 1 kA/µs adds about 1 kV per metre of connecting lead{{I027}}; leads should be as short as possible, preferably not over 0.5 m in total{{I028}}, and bound together.{{I029}} In BEAMA's test an SPD with Up 600 V gave 630 V with 25 cm of bound lead{{I030}}, 810 V with 25 cm unbound and 2,300 V with 2 m unbound.{{I031}} Category I equipment at 230/240 V is rated 1.5 kV.{{I020}}"
      - callout:
          kind: do
          title: "Short, straight, tied together"
          text: "Keep the total lead length as short as possible, preferably under 0.5 m{{I028}}, and tie the two leads together along their length.{{I029}}"
  - title: "3  Where the SPD goes in the board"
    blocks:
      - diagram:
          name: spd_db_wiring
          caption: "Concept sketch. (1) where the structure has an external LPS, Type 1 SPDs as close as possible to the origin (UK){{I075}}, usually at the main distribution board{{I024}} (2) a backup overcurrent protective device in series{{I039}} (3) short connecting leads{{I028}} (4) SPD earth to the earth bar.{{B024}}"
      - facts: [D048, D050, I044, B023]
