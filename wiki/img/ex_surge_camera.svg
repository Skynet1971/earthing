<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}svg{--cycle:9s}.p1{animation:p1 9s infinite}@keyframes p1{0%{opacity:1}25%{opacity:1}26%{opacity:0}100%{opacity:0}}.s1{animation:s1 9s infinite}@keyframes s1{0%{opacity:1}25%{opacity:1}26%{opacity:0.35}100%{opacity:0.35}}.p2{animation:p2 9s infinite}@keyframes p2{0%{opacity:0}24%{opacity:0}25%{opacity:1}62%{opacity:1}63%{opacity:0}100%{opacity:0}}.s2{animation:s2 9s infinite}@keyframes s2{0%{opacity:0.35}24%{opacity:0.35}25%{opacity:1}62%{opacity:1}63%{opacity:0.35}100%{opacity:0.35}}.p3{animation:p3 9s infinite}@keyframes p3{0%{opacity:0}61%{opacity:0}62%{opacity:1}85%{opacity:1}86%{opacity:0}100%{opacity:0}}.s3{animation:s3 9s infinite}@keyframes s3{0%{opacity:0.35}61%{opacity:0.35}62%{opacity:1}85%{opacity:1}86%{opacity:0.35}100%{opacity:0.35}}.p4{animation:p4 9s infinite}@keyframes p4{0%{opacity:0}84%{opacity:0}85%{opacity:1}100%{opacity:1}}.s4{animation:s4 9s infinite}@keyframes s4{0%{opacity:0.35}84%{opacity:0.35}85%{opacity:1}100%{opacity:1}}</style><rect x="0" y="0" width="960" height="600" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#0E7490"/><rect x="0" y="40" width="960" height="18" fill="#0E7490"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">How a surge reaches a PoE camera, and where it is diverted</text><rect x="20" y="380" width="920" height="24" fill="#D6C7A8"/><polygon class="flash" points="449.0,70 401.0,136.0 438.2,136.0 416.6,190.0 488.6,118.0 451.4,118.0 481.4,70" fill="#FACC15" stroke="#D97706" stroke-width="3"/><rect x="118" y="150" width="16" height="230" fill="#9CA3AF"/><g><rect x="70" y="100" width="130" height="48" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2.5"/><text x="135.0" y="130.65" font-size="19" fill="#1F2937" text-anchor="middle" font-weight="700">Camera</text></g><g><rect x="161.0" y="185.0" width="78" height="40" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="200.0" y="210.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">SPD 1</text></g><polyline points="134,148 134,205 161,205" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="240" y="191" width="380" height="28" rx="14" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5"/><polyline points="239,205 640,205" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="430" y="248" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">shielded cable (STP)</text><polyline points="200,225 200,300 134,300" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="200,225 200,300 134,300" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><polyline points="126,380 126,392" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="126,380 126,392" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g stroke="#2F9E44" stroke-width="4" stroke-linecap="round"><line x1="126" y1="392" x2="126" y2="404"/><line x1="114" y1="404" x2="138" y2="404"/><line x1="118.56" y1="409.4" x2="133.44" y2="409.4"/><line x1="123.0" y1="414.8" x2="129.0" y2="414.8"/></g><rect x="610" y="100" width="320" height="280" rx="12" fill="#F8FAFC" stroke="#0F2A47" stroke-width="3"/><text x="770" y="128" font-size="20" fill="#0F2A47" text-anchor="middle" font-weight="700">Building</text><g><rect x="641.0" y="185.0" width="78" height="40" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="680.0" y="210.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">SPD 2</text></g><polyline points="719,205 760,205" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><g><rect x="760" y="175" width="150" height="60" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2.5"/><text x="835.0" y="200.05" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">PoE switch</text><text x="835.0" y="222.55" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="400">(earthed)</text></g><g><rect x="700" y="305" width="200" height="42" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="800.0" y="331.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">Main earthing bar</text></g><polyline points="680,225 680,326 700,326" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="680,225 680,326 700,326" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><polyline points="835,235 835,305" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="835,235 835,305" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><polyline points="800,347 800,392" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="800,347 800,392" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g stroke="#2F9E44" stroke-width="4" stroke-linecap="round"><line x1="800" y1="392" x2="800" y2="404"/><line x1="788" y1="404" x2="812" y2="404"/><line x1="792.56" y1="409.4" x2="807.44" y2="409.4"/><line x1="797.0" y1="414.8" x2="803.0" y2="414.8"/></g><g class="p1"><path d="M330,170 q20,-18 40,0 t40,0 t40,0" fill="none" stroke="#D97706" stroke-width="4"/><text x="455" y="160" font-size="18" fill="#D97706" text-anchor="middle" font-weight="700">induced voltage</text></g><g class="p2"><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.00s" path="M430,205 L240,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.40s" path="M430,205 L240,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.80s" path="M430,205 L240,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-1.20s" path="M430,205 L240,205"/></circle></g><g class="p2"><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.00s" path="M430,205 L640,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.40s" path="M430,205 L640,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-0.80s" path="M430,205 L640,205"/></circle><circle r="9" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-1.20s" path="M430,205 L640,205"/></circle></g><g class="p3"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M200,225 L200,300 L134,300 L126,392"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M200,225 L200,300 L134,300 L126,392"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M200,225 L200,300 L134,300 L126,392"/></circle></g><g class="p3"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M680,225 L680,326 L800,326 L800,392"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M680,225 L680,326 L800,326 L800,392"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M680,225 L680,326 L800,326 L800,392"/></circle></g><g class="p4"><circle cx="890" cy="160" r="22" fill="#2F9E44"/><polyline points="879,160 887,168 902,151" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/></g><g class="s1"><rect x="32" y="420" width="904" height="38" rx="9" fill="#D97706" opacity="0.13"/><circle cx="54" cy="439" r="15" fill="#D97706"/><text x="54" y="445" font-size="18" fill="white" text-anchor="middle" font-weight="700">1</text><text x="80" y="446" font-size="18" fill="#1F2937">A nearby flash induces a voltage on the camera cable.</text></g><g class="s2"><rect x="32" y="462" width="904" height="38" rx="9" fill="#DC2626" opacity="0.13"/><circle cx="54" cy="481" r="15" fill="#DC2626"/><text x="54" y="487" font-size="18" fill="white" text-anchor="middle" font-weight="700">2</text><text x="80" y="488" font-size="18" fill="#1F2937">The surge travels along the cable towards both ends.</text></g><g class="s3"><rect x="32" y="504" width="904" height="38" rx="9" fill="#2F9E44" opacity="0.13"/><circle cx="54" cy="523" r="15" fill="#2F9E44"/><text x="54" y="529" font-size="18" fill="white" text-anchor="middle" font-weight="700">3</text><text x="80" y="530" font-size="18" fill="#1F2937">SPD 1 and SPD 2 divert it to earth: the pole and the main earthing bar.</text></g><g class="s4"><rect x="32" y="546" width="904" height="38" rx="9" fill="#0E7490" opacity="0.13"/><circle cx="54" cy="565" r="15" fill="#0E7490"/><text x="54" y="571" font-size="18" fill="white" text-anchor="middle" font-weight="700">4</text><text x="80" y="572" font-size="18" fill="#1F2937">Camera and switch are protected; the earthed switch gives the cable shield its path to earth.</text></g></svg>