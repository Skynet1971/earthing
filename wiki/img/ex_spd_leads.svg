<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 7s infinite}@keyframes grow{0%{transform:scaleY(0)}18%,92%{transform:scaleY(1)}100%{transform:scaleY(1)}}.b2{animation-delay:.5s}.b3{animation-delay:1s}.b4{animation-delay:1.5s}</style><rect x="0" y="0" width="960" height="540" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#D97706"/><rect x="0" y="40" width="960" height="18" fill="#D97706"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">Why SPD wires must be short and bound together (BEAMA test results)</text><rect x="30" y="90" width="330" height="420" rx="12" fill="#F8FAFC" stroke="#0F2A47" stroke-width="2"/><text x="195" y="122" font-size="19" fill="#0F2A47" text-anchor="middle" font-weight="700">In the distribution board</text><polyline points="60,170 330,170" fill="none" stroke="#DC2626" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><text x="64" y="160" font-size="17" fill="#DC2626" text-anchor="start" font-weight="400">line busbar</text><g><rect x="130" y="245" width="130" height="60" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="195.0" y="282.35" font-size="21" fill="#1F2937" text-anchor="middle" font-weight="700">SPD</text></g><polyline points="195,170 195,245" fill="none" stroke="#DC2626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" class="flow" /><g><rect x="90" y="380" width="210" height="40" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="195.0" y="406.3" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">Earth bar</text></g><polyline points="195,305 195,380" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="195,305 195,380" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><text x="215" y="215" font-size="19" fill="#D97706" text-anchor="start" font-weight="700">l1</text><text x="215" y="350" font-size="19" fill="#D97706" text-anchor="start" font-weight="700">l2</text><text x="195" y="455" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">about 1 kV per metre of lead</text><text x="195" y="480" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">at 1 kA/µs (1 µH/m)</text><text x="195" y="502" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700">preferably l1 + l2 ≤ 0.5 m</text><polyline points="430,470 920,470" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="430,470 430,130" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="430,404.0 920,404.0" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="422" y="410.0" font-size="17" fill="#6B7280" text-anchor="end" font-weight="400">500 V</text><polyline points="430,338.0 920,338.0" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="422" y="344.0" font-size="17" fill="#6B7280" text-anchor="end" font-weight="400">1000 V</text><polyline points="430,272.0 920,272.0" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="422" y="278.0" font-size="17" fill="#6B7280" text-anchor="end" font-weight="400">1500 V</text><polyline points="430,206.0 920,206.0" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="422" y="212.0" font-size="17" fill="#6B7280" text-anchor="end" font-weight="400">2000 V</text><polyline points="430,140.0 920,140.0" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="422" y="146.0" font-size="17" fill="#6B7280" text-anchor="end" font-weight="400">2500 V</text><polyline points="430,272.0 920,272.0" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" /><text x="440" y="262.0" font-size="17" fill="#DC2626" text-anchor="start" font-weight="700">equipment category I: 1.5 kV</text><rect class="bar b1" x="460" y="390.8" width="80" height="79.2" rx="6" fill="#0F2A47"/><text x="500" y="380.8" font-size="18" fill="#0F2A47" text-anchor="middle" font-weight="700">Up 600 V</text><text x="500" y="496" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">SPD alone</text><rect class="bar b2" x="578" y="386.84000000000003" width="80" height="83.16" rx="6" fill="#2F9E44"/><text x="618" y="376.84000000000003" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700">630 V</text><text x="618" y="496" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">25 cm, bound</text><rect class="bar b3" x="696" y="363.08" width="80" height="106.92" rx="6" fill="#D97706"/><text x="736" y="353.08" font-size="18" fill="#D97706" text-anchor="middle" font-weight="700">810 V</text><text x="736" y="496" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">25 cm, loose</text><rect class="bar b4" x="814" y="166.39999999999998" width="80" height="303.6" rx="6" fill="#DC2626"/><text x="854" y="156.39999999999998" font-size="18" fill="#DC2626" text-anchor="middle" font-weight="700">2 300 V</text><text x="854" y="496" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">2 m, loose</text></svg>