,300 L830,345 L610,345 M420,345 L360,345 L360,255 L131,255"/></circle><circle r="8" fill="#DC2626" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-0.67s" path="M131,175 L470,175 L590,175 L700,175 L765,175 L765,250 L830,300 L830,345 L610,345 M420,345 L360,345 L360,255 L131,255"/></circle><circle r="8" fill="#DC2626" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-1.00s" path="M131,175 L470,175 L590,175 L700,175 L765,175 L765,250 L830,300 L830,345 L610,345 M420,345 L360,345 L360,255 L131,255"/></circle><circle r="8" fill="#DC2626" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-1.33s" path="M131,175 L470,175 L590,175 L700,175 L765,175 L765,250 L830,300 L830,345 L610,345 M420,345 L360,345 L360,255 L131,255"/></circle><circle r="8" fill="#DC2626" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-1.67s" path="M131,175 L470,175 L590,175 L700,175 L765,175 L765,250 L830,300 L830,345 L610,345 M420,345 L360,345 L360,255 L131,255"/></circle></g><g class="s1"><rect x="32" y="436" width="904" height="38" rx="9" fill="#2563EB" opacity="0.13"/><circle cx="54" cy="455" r="15" fill="#2563EB"/><text x="54" y="461" font-size="18" fill="white" text-anchor="middle" font-weight="700">1</text><text x="80" y="462" font-size="18" fill="#1F2937">Normal: current goes out on L and returns on the neutral.</text></g><g class="s2"><rect x="32" y="477" width="904" height="38" rx="9" fill="#DC2626" opacity="0.13"/><circle cx="54" cy="496" r="15" fill="#DC2626"/><text x="54" y="502" font-size="18" fill="white" text-anchor="middle" font-weight="700">2</text><text x="80" y="503" font-size="18" fill="#1F2937">Fault: L touches the metal case. Current returns on PE and the PEN to the transformer.</text></g><g class="s3"><rect x="32" y="516" width="904" height="38" rx="9" fill="#2F9E44" opacity="0.13"/><circle cx="54" cy="535" r="15" fill="#2F9E44"/><text x="54" y="541" font-size="18" fill="white" text-anchor="middle" font-weight="700">3</text><text x="80" y="542" font-size="18" fill="#1F2937">The protective device opens automatically (TN: within 0.4 s for socket-outlet circuits).</text></g></svg>