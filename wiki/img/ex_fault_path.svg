<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}svg{--cycle:12s}.p1{animation:p1 12s infinite}@keyframes p1{0%{opacity:1}33%{opacity:1}34%{opacity:0}100%{opacity:0}}.s1{animation:s1 12s infinite}@keyframes s1{0%{opacity:1}33%{opacity:1}34%{opacity:0.35}100%{opacity:0.35}}.p2{animation:p2 12s infinite}@keyframes p2{0%{opacity:0}32%{opacity:0}33%{opacity:1}66%{opacity:1}67%{opacity:0}100%{opacity:0}}.s2{animation:s2 12s infinite}@keyframes s2{0%{opacity:0.35}32%{opacity:0.35}33%{opacity:1}66%{opacity:1}67%{opacity:0.35}100%{opacity:0.35}}.p3{animation:p3 12s infinite}@keyframes p3{0%{opacity:0}65%{opacity:0}66%{opacity:1}100%{opacity:1}}.s3{animation:s3 12s infinite}@keyframes s3{0%{opacity:0.35}65%{opacity:0.35}66%{opacity:1}100%{opacity:1}}</style><rect x="0" y="0" width="960" height="560" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#2F9E44"/><rect x="0" y="40" width="960" height="18" fill="#2F9E44"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">How the earth makes a fault switch itself off (TN-C-S supply)</text><rect x="20" y="410" width="920" height="22" fill="#D6C7A8"/><circle cx="95" cy="190" r="36" fill="none" stroke="#1F2937" stroke-width="4"/><circle cx="95" cy="240" r="36" fill="none" stroke="#1F2937" stroke-width="4"/><text x="95" y="115" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">Supply</text><text x="95" y="136" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">transformer</text><polyline points="95,276 95,330" fill="none" stroke="#1F2937" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polyline points="95,330 95,395" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="95,330 95,395" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g stroke="#2F9E44" stroke-width="4" stroke-linecap="round"><line x1="95" y1="395" x2="95" y2="411"/><line x1="79" y1="411" x2="111" y2="411"/><line x1="85.08" y1="418.2" x2="104.92" y2="418.2"/><line x1="91.0" y1="425.4" x2="99.0" y2="425.4"/></g><rect x="300" y="90" width="620" height="315" rx="12" fill="#F8FAFC" stroke="#0F2A47" stroke-width="3"/><text x="318" y="118" font-size="20" fill="#0F2A47" text-anchor="start" font-weight="700">House</text><polyline points="131,175 470,175" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><text x="200" y="165" font-size="19" fill="#DC2626" text-anchor="start" font-weight="700">L</text><polyline points="131,255 360,255" fill="none" stroke="#2563EB" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><polyline points="131,255 360,255" fill="none" stroke="#2F9E44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 12" /><text x="128" y="236" font-size="17" fill="#2563EB" text-anchor="start" font-weight="700">PEN (N + PE combined)</text><circle cx="360" cy="255" r="8" fill="#1F2937"/><polyline points="360,255 700,255" fill="none" stroke="#2563EB" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><text x="560" y="247" font-size="19" fill="#2563EB" text-anchor="start" font-weight="700">N</text><polyline points="360,255 360,345 420,345" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="360,255 360,345 420,345" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g><rect x="420" y="325" width="190" height="42" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="515.0" y="351.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">Main earthing terminal</text></g><polyline points="610,345 830,345 830,300" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="610,345 830,345 830,300" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g><rect x="470" y="150" width="120" height="50" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/><text x="530.0" y="170.325" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">Protective</text><text x="530.0" y="191.575" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">device</text></g><g class="p3"><rect x="470" y="150" width="120" height="50" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="3"/><text x="530" y="182" font-size="19" fill="#DC2626" text-anchor="middle" font-weight="700">OPEN</text></g><polyline points="590,175 700,175" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="700" y="140" width="190" height="160" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="3"/><text x="795" y="130" font-size="18" fill="#0F2A47" text-anchor="middle" font-weight="700">Appliance (metal case)</text><polyline points="730,175 745,175 755,160 770,190 785,160 800,190 815,175 860,175 860,255 700,255" fill="none" stroke="#1F2937" stroke-width="3"/><g class="p2"><polygon points="760,2