<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}svg{--cycle:9s}.p1{animation:p1 9s infinite}@keyframes p1{0%{opacity:1}33%{opacity:1}34%{opacity:0}100%{opacity:0}}.s1{animation:s1 9s infinite}@keyframes s1{0%{opacity:1}33%{opacity:1}34%{opacity:0.35}100%{opacity:0.35}}.p2{animation:p2 9s infinite}@keyframes p2{0%{opacity:0}32%{opacity:0}33%{opacity:1}66%{opacity:1}67%{opacity:0}100%{opacity:0}}.s2{animation:s2 9s infinite}@keyframes s2{0%{opacity:0.35}32%{opacity:0.35}33%{opacity:1}66%{opacity:1}67%{opacity:0.35}100%{opacity:0.35}}.p3{animation:p3 9s infinite}@keyframes p3{0%{opacity:0}65%{opacity:0}66%{opacity:1}100%{opacity:1}}.s3{animation:s3 9s infinite}@keyframes s3{0%{opacity:0.35}65%{opacity:0.35}66%{opacity:1}100%{opacity:1}}.ring{animation:ring 1.2s ease-out infinite}@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.4)}}.ring{transform-box:fill-box;transform-origin:center}</style><rect x="0" y="0" width="960" height="600" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#D97706"/><rect x="0" y="40" width="960" height="18" fill="#D97706"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">Bound or unbound (loose) SPD wires: what the words mean</text><rect x="20" y="76" width="450" height="372" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="3"/><text x="245" y="108" font-size="21" fill="#DC2626" text-anchor="middle" font-weight="700">UNBOUND (loose): wires apart</text><g><rect x="40" y="148" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="95.0" y="176.3" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">A: line</text></g><g><rect x="40" y="330" width="110" height="44" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="95.0" y="357.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">B: earth bar</text></g><g><rect x="350" y="220" width="100" height="80" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="400.0" y="267.7" font-size="22" fill="#1F2937" text-anchor="middle" font-weight="700">SPD</text></g><polyline points="150,170 400,170 400,220" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400,300 400,352 150,352" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="400,300 400,352 150,352" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g class="p2 p3"><circle class="ring" cx="275" cy="170" r="40" fill="none" stroke="#2563EB" stroke-width="3"/></g><g class="p2 p3"><circle class="ring" cx="275" cy="352" r="40" fill="none" stroke="#2563EB" stroke-width="3"/></g><text x="195" y="268" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">big loop: fields</text><text x="195" y="290" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">do not cancel</text><text x="245" y="410" font-size="18" fill="#DC2626" text-anchor="middle" font-weight="700">810 V with the same 25 cm leads</text><g class="p1"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M150,170 L400,170 L400,220"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M150,170 L400,170 L400,220"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M150,170 L400,170 L400,220"/></circle></g><g class="p1"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M400,300 L400,352 L150,352"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M400,300 L400,352 L150,352"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M400,300 L400,352 L150,352"/></circle></g><text x="190" y="160" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">l1 in</text><text x="190" y="344" font-size="17" fill="#2F9E44" text-anchor="middle" font-weight="700">l2 out</text><rect x="490" y="76" width="450" height="372" rx="12" fill="#E9F7EC" stroke="#2F9E44" stroke-width="3"/><text x="715" y="108" font-size="21" fill="#2F9E44" text-anchor="middle" font-weight="700">BOUND: wires tied together</text><g><rect x="510" y="148" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="565.0" y="176.3" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">A: line</text></g><g><rect x="510" y="330" width="110" height="44" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="565.0" y="357.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">B: earth bar</text></g><g><rect x="820" y="220" width="100" height="80" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="870.0" y="267.7" font-size="22" fill="#1F2937" text-anchor="middle" font-weight="700">SPD</text></g><polyline points="620,170 650,170 650,252 820,252" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="620,352 670,352 670,268 820,268" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="620,352 670,352 670,268 820,268" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><rect x="700" y="242" width="10" height="36" rx="3" fill="#1F2937"/><rect x="745" y="242" width="10" height="36" rx="3" fill="#1F2937"/><rect x="790" y="242" width="10" height="36" rx="3" fill="#1F2937"/><text x="748" y="216" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">cable ties</text><g class="p2 p3"><circle class="ring" cx="740" cy="260.0" r="22" fill="none" stroke="#2563EB" stroke-width="2" opacity=".4"/></g><text x="715" y="410" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700">opposite fields cancel: 630 V (25 cm)</text><g class="p1"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M620,170 L650,170 L650,252 L820,252"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M620,170 L650,170 L650,252 L820,252"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M620,170 L650,170 L650,252 L820,252"/></circle></g><g class="p1"><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.00s" path="M820,268 L670,268 L670,352 L620,352"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s" path="M820,268 L670,268 L670,352 L620,352"/></circle><circle r="8" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.93s" path="M820,268 L670,268 L670,352 L620,352"/></circle></g><text x="790" y="238" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">l1 in</text><text x="790" y="292" font-size="17" fill="#2F9E44" text-anchor="middle" font-weight="700">l2 out</text><g class="s1"><rect x="32" y="468" width="904" height="38" rx="9" fill="#D97706" opacity="0.13"/><circle cx="54" cy="487" r="15" fill="#D97706"/><text x="54" y="493" font-size="18" fill="white" text-anchor="middle" font-weight="700">1</text><text x="80" y="494" font-size="18" fill="#1F2937">The surge current flows into the SPD on l1 and out on l2: opposite directions.</text></g><g class="s2"><rect x="32" y="510" width="904" height="38" rx="9" fill="#DC2626" opacity="0.13"/><circle cx="54" cy="529" r="15" fill="#DC2626"/><text x="54" y="535" font-size="18" fill="white" text-anchor="middle" font-weight="700">2</text><text x="80" y="536" font-size="18" fill="#1F2937">Unbound (loose): the wires are apart, so their opposite fields do not cancel.</text></g><g class="s3"><rect x="32" y="552" width="904" height="38" rx="9" fill="#2F9E44" opacity="0.13"/><circle cx="54" cy="571" r="15" fill="#2F9E44"/><text x="54" y="577" font-size="18" fill="white" text-anchor="middle" font-weight="700">3</text><text x="80" y="578" font-size="18" fill="#1F2937">Bound: tied side by side, the opposite fields cancel and the voltage drops.</text></g></svg>