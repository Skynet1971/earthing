<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}svg{--cycle:12s}.p1{animation:p1 12s infinite}@keyframes p1{0%{opacity:1}25%{opacity:1}26%{opacity:0}100%{opacity:0}}.s1{animation:s1 12s infinite}@keyframes s1{0%{opacity:1}25%{opacity:1}26%{opacity:0.35}100%{opacity:0.35}}.p2{animation:p2 12s infinite}@keyframes p2{0%{opacity:0}24%{opacity:0}25%{opacity:1}50%{opacity:1}51%{opacity:0}100%{opacity:0}}.s2{animation:s2 12s infinite}@keyframes s2{0%{opacity:0.35}24%{opacity:0.35}25%{opacity:1}50%{opacity:1}51%{opacity:0.35}100%{opacity:0.35}}.p3{animation:p3 12s infinite}@keyframes p3{0%{opacity:0}49%{opacity:0}50%{opacity:1}75%{opacity:1}76%{opacity:0}100%{opacity:0}}.s3{animation:s3 12s infinite}@keyframes s3{0%{opacity:0.35}49%{opacity:0.35}50%{opacity:1}75%{opacity:1}76%{opacity:0.35}100%{opacity:0.35}}.p4{animation:p4 12s infinite}@keyframes p4{0%{opacity:0}74%{opacity:0}75%{opacity:1}100%{opacity:1}}.s4{animation:s4 12s infinite}@keyframes s4{0%{opacity:0.35}74%{opacity:0.35}75%{opacity:1}100%{opacity:1}}</style><rect x="0" y="0" width="960" height="664" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#2F9E44"/><rect x="0" y="40" width="960" height="18" fill="#2F9E44"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">Where the house earth comes from, and what joins it</text><rect x="20" y="380" width="920" height="26" fill="#D6C7A8"/><circle cx="80" cy="190" r="30" fill="none" stroke="#1F2937" stroke-width="4"/><circle cx="80" cy="232" r="30" fill="none" stroke="#1F2937" stroke-width="4"/><text x="80" y="124" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">Supply</text><text x="80" y="145" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">transformer</text><polyline points="80,262 80,392" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="80,262 80,392" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g stroke="#2F9E44" stroke-width="4" stroke-linecap="round"><line x1="80" y1="392" x2="80" y2="405"/><line x1="67" y1="405" x2="93" y2="405"/><line x1="71.94" y1="410.85" x2="88.06" y2="410.85"/><line x1="76.75" y1="416.7" x2="83.25" y2="416.7"/></g><g class="s1"><rect x="92" y="300" width="182" height="58" rx="8" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2"/><text x="183" y="324" font-size="17" text-anchor="middle" font-weight="700" fill="#2F9E44">N and earth joined</text><text x="183" y="346" font-size="17" text-anchor="middle" fill="#1F2937">typically &lt; 10 Ω</text></g><polyline points="110,232 300,232" fill="none" stroke="#2563EB" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><polyline points="110,232 300,232" fill="none" stroke="#2F9E44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 12" /><text x="205" y="220" font-size="17" fill="#2563EB" text-anchor="middle" font-weight="700">PEN cable</text><g class="p2"><circle r="7" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.5s" repeatCount="indefinite" begin="-0.00s" path="M110,232 L300,232"/></circle><circle r="7" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.5s" repeatCount="indefinite" begin="-0.50s" path="M110,232 L300,232"/></circle><circle r="7" fill="#D97706" stroke="white" stroke-width="2"><animateMotion dur="1.5s" repeatCount="indefinite" begin="-1.00s" path="M110,232 L300,232"/></circle></g><rect x="300" y="96" width="420" height="284" rx="12" fill="#F8FAFC" stroke="#0F2A47" stroke-width="3"/><text x="510" y="124" font-size="20" fill="#0F2A47" text-anchor="middle" font-weight="700">House</text><g><rect x="320" y="200" width="150" height="64" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="395.0" y="227.325" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">Supply-entry</text><text x="395.0" y="248.575" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">board</text></g><text x="395" y="290" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">no N-E link after</text><text x="395" y="311" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="700">the main switch</text><g><rect x="500" y="214" width="200" height="40" rx="10" fill="#E9F7EC" stroke="#2F9E44" stroke-width="2.5"/><text x="600.0" y="240.3" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="700">Main earth bar</text></g><polyline points="470,234 500,234" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="470,234 500,234" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g><rect x="560" y="140" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/><text x="630.0" y="165.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">Other boards</text></g><polyline points="630,180 630,214" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><polyline points="630,180 630,214" fill="non