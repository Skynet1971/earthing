inecap="round" /><polyline points="776,380 776,392" fill="none" stroke="#FACC15" stroke-width="2.52" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g stroke="#2F9E44" stroke-width="4" stroke-linecap="round"><line x1="776" y1="392" x2="776" y2="403"/><line x1="765" y1="403" x2="787" y2="403"/><line x1="769.18" y1="407.95" x2="782.82" y2="407.95"/><line x1="773.25" y1="412.9" x2="778.75" y2="412.9"/></g><g class="p3"><polyline points="700,234 900,234" fill="none" stroke="#2F9E44" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><polyline points="700,234 900,234" fill="none" stroke="#FACC15" stroke-width="2.94" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /></g><polyline points="600,418 920,418" fill="none" stroke="#2F9E44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polyline points="600,418 920,418" fill="none" stroke="#FACC15" stroke-width="1.68" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><polyline points="776,410 776,418" fill="none" stroke="#2F9E44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polyline points="776,410 776,418" fill="none" stroke="#FACC15" stroke-width="1.68" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><polyline points="820,410 820,418" fill="none" stroke="#2F9E44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polyline points="820,410 820,418" fill="none" stroke="#FACC15" stroke-width="1.68" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" /><g class="p3"><circle r="6" fill="#2F9E44" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-0.00s" path="M600,418 L920,418"/></circle><circle r="6" fill="#2F9E44" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-0.50s" path="M600,418 L920,418"/></circle><circle r="6" fill="#2F9E44" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-1.00s" path="M600,418 L920,418"/></circle><circle r="6" fill="#2F9E44" stroke="white" stroke-width="2"><animateMotion dur="2.0s" repeatCount="indefinite" begin="-1.50s" path="M600,418 L920,418"/></circle></g><rect x="20" y="430" width="250" height="44" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="2"/><text x="145" y="458" font-size="17" fill="#7C3AED" text-anchor="middle" font-weight="700">Fence energizer rods</text><g class="p4"><line x1="270" y1="452" x2="590" y2="452" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 6"/><text x="430" y="444" font-size="18" fill="#DC2626" text-anchor="middle" font-weight="700">keep ≥ 2 m away, not joined</text></g><g class="s1"><rect x="32" y="490" width="904" height="38" rx="9" fill="#2F9E44" opacity="0.13"/><circle cx="54" cy="509" r="15" fill="#2F9E44"/><text x="54" y="515" font-size="18" fill="white" text-anchor="middle" font-weight="700">1</text><text x="80" y="516" font-size="18" fill="#1F2937">The supply earth starts at the transformer: neutral and earth joined, into the soil.</text></g><g class="s2"><rect x="32" y="532" width="904" height="38" rx="9" fill="#2563EB" opacity="0.13"/><circle cx="54" cy="551" r="15" fill="#2563EB"/><text x="54" y="557" font-size="18" fill="white" text-anchor="middle" font-weight="700">2</text><text x="80" y="558" font-size="18" fill="#1F2937">In TN-C-S the PEN cable brings that earth to the house.</text></g><g class="s3"><rect x="32" y="574" width="904" height="38" rx="9" fill="#0E7490" opacity="0.13"/><circle cx="54" cy="593" r="15" fill="#0E7490"/><text x="54" y="599" font-size="18" fill="white" text-anchor="middle" font-weight="700">3</text><text x="80" y="600" font-size="18" fill="#1F2937">Every rod of the installation joins the house earth: house rod, PV spike, camera pole.</text></g><g class="s4"><rect x="32" y="616" width="904" height="38" rx="9" fill="#7C3AED" opacity="0.13"/><circle cx="54" cy="635" r="15" fill="#7C3AED"/><text x="54" y="641" font-size="18" fill="white" text-anchor="middle" font-weight="700">4</text><text x="80" y="642" font-size="18" fill="#1F2937">Exception: the electric-fence earth stays at least 2 m away (security fence).</text></g></svg>