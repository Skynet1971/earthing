<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.flash{animation:flash var(--cycle) infinite}@keyframes flash{0%,6%{opacity:1}3%{opacity:.25}12%,100%{opacity:.35}}.flow{stroke-dasharray:14 12;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pulse{animation:move 4s linear infinite}@keyframes move{0%{transform:translateX(-60px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(90px);opacity:0}}</style><rect x="0" y="0" width="960" height="540" rx="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="0" y="0" width="960" height="58" rx="14" fill="#2563EB"/><rect x="0" y="40" width="960" height="18" fill="#2563EB"/><defs><pattern id="pe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#2F9E44"/><rect x="8" width="8" height="16" fill="#FACC15"/></pattern></defs><rect x="0" y="58" width="960" height="6" fill="url(#pe)"/><text x="24" y="39" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="700">Lightning protection zones: each boundary takes energy out</text><rect x="20" y="80" width="330" height="300" fill="#FEF4E2"/><text x="215.0" y="118" font-size="24" fill="#0F2A47" text-anchor="middle" font-weight="700">LPZ 0</text><text x="215.0" y="144" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">full current possible</text><rect x="350" y="80" width="310" height="300" fill="#E8F0FE"/><text x="505.0" y="118" font-size="24" fill="#0F2A47" text-anchor="middle" font-weight="700">LPZ 1</text><text x="505.0" y="144" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">partial lightning currents</text><rect x="660" y="80" width="280" height="300" fill="#E9F7EC"/><text x="800.0" y="118" font-size="24" fill="#0F2A47" text-anchor="middle" font-weight="700">LPZ 2</text><text x="800.0" y="144" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="400">only remnants</text><rect x="345" y="80" width="10" height="300" fill="#0F2A47"/><g><rect x="315.0" y="332.0" width="70" height="40" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="350.0" y="357.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">SPD</text></g><text x="350" y="410" font-size="17" fill="#D97706" text-anchor="middle" font-weight="700">SPD: lightning</text><text x="350" y="432" font-size="17" fill="#D97706" text-anchor="middle" font-weight="700">current protection</text><rect x="655" y="80" width="10" height="300" fill="#0F2A47"/><g><rect x="625.0" y="332.0" width="70" height="40" rx="10" fill="#FEF4E2" stroke="#D97706" stroke-width="2.5"/><text x="660.0" y="357.95" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="700">SPD</text></g><text x="660" y="410" font-size="17" fill="#D97706" text-anchor="middle" font-weight="700">SPD: overvoltage</text><text x="660" y="432" font-size="17" fill="#D97706" text-anchor="middle" font-weight="700">protection</text><g class="pulse"><path d="M115,320 L160,320 L173,200 L225,278.0 L255,320" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round"/></g><g class="pulse"><path d="M435,320 L480,320 L493,260 L545,299.0 L575,320" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round"/></g><g class="pulse"><path d="M730,320 L775,320 L788,298 L840,312.3 L870,320" fill="none" stroke="#DC2626" stroke-width="6" stroke-linejoin="round"/></g><polygon class="flash" points="59.5,150 31.5,188.5 53.2,188.5 40.6,220.0 82.6,178.0 60.9,178.0 78.4,150" fill="#FACC15" stroke="#D97706" stroke-width="3"/><text x="480" y="488" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="400">Each boundary combines bonding, shielding and a coordinated SPD.</text></svg>