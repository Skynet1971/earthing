<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>text{font-family:Segoe UI, Helvetica, Arial, sans-serif}.fl{animation:fl 4s infinite}@keyframes fl{0%,5%{opacity:1}2.5%{opacity:.3}10%,100%{opacity:.25}}
