# Rebuild the public PDFs and publish the wiki whenever the content changes on the default branch
# (the job is skipped on other branches).
# One-time setup: enable the wiki (Settings > Features > Wikis) and create any first page in the
# wiki web UI, so that the <repo>.wiki.git repository exists. After that this runs unattended.
name: Build PDFs and publish wiki
on:
  push:
    paths: ["content/**", "tools/**", "references/catalog.yaml", ".github/workflows/wiki.yml"]
  workflow_dispatch: {}
permissions:
  contents: write   # needed to push to the wiki repository with GITHUB_TOKEN
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  build:
    # Publish only from the repository's default branch (whatever it is called).
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install reportlab==4.2.5 pyyaml==6.0.2 pillow==11.1.0
      - name: Build public PDFs (private documents are skipped automatically)
        run: python3 tools/build_pdfs.py
      - name: Build wiki pages
        run: python3 tools/build_wiki.py
      - name: Upload PDFs as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: docs/pdf/*.pdf
      - name: Publish to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki unchanged"; exit 0; fi
          git commit -m "Regenerate wiki from ${GITHUB_SHA::7}"
          git push
